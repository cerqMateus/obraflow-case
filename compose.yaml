name: obraflow

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    command: [pnpm, run, 'db:migrate']
    environment: &database-environment
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  backend-tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    command: [pnpm, run, typecheck]
    environment: *database-environment
    networks: [internal]

  frontend-tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: tools
    command: [pnpm, run, typecheck]
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
