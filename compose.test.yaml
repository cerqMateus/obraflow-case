name: obraflow-test

services:
  e2e:
    profiles: [tools]
    build:
      context: .
      dockerfile: e2e/Dockerfile
      target: tools
    environment:
      COMPOSE_PROJECT_NAME: obraflow-test
      E2E_BASE_URL: http://frontend
    depends_on:
      frontend:
        condition: service_started
    volumes:
      - ./e2e/evidence:/workspace/e2e/evidence
    networks: [internal]

  postgres:
    environment:
      POSTGRES_DB: obraflow_test
      POSTGRES_USER: obraflow_test
    volumes: !override
      - postgres-test-data:/var/lib/postgresql/data

  migrate:
    environment:
      POSTGRES_DB: obraflow_test
      POSTGRES_USER: obraflow_test

  backend:
    environment:
      APP_ENV: test
      POSTGRES_DB: obraflow_test
      POSTGRES_USER: obraflow_test
      APP_ORIGIN: http://frontend

  frontend:
    ports: !override
      - '127.0.0.1:18080:80'

  backend-tools:
    environment:
      POSTGRES_DB: obraflow_test
      POSTGRES_USER: obraflow_test
      NODE_ENV: test
      COMPOSE_PROJECT_NAME: obraflow-test
      DATABASE_URL: postgresql://obraflow_test:${POSTGRES_PASSWORD:?Configure test password}@postgres:5432/obraflow_test
      TEST_DATABASE_URL: postgresql://obraflow_test:${POSTGRES_PASSWORD:?Configure test password}@postgres:5432/obraflow_test

volumes:
  postgres-test-data:
